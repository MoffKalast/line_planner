#!/usr/bin/env python3

PACKAGE = "line_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("publish_debug_markers", bool_t, 0, "Publish debug markers", True)
gen.add("ignore_altitude", bool_t, 0, "Ignore Z values", False)

gen.add("max_linear_speed", double_t, 0, "Maximum linear speed", 0.45, 0, 5)
gen.add("max_turning_speed", double_t, 0, "Maximum turning speed", 0.9, 0, 5)
gen.add("max_vertical_speed", double_t, 0, "Maximum vertical speed", 0.5, 0, 5)

gen.add("max_line_divergence", double_t, 0, "Maximum line divergence", 1.0, 0, 50)

gen.add("min_project_dist", double_t, 0, "Minimum projection distance", 0.15, 0.01, 20)
gen.add("max_project_dist", double_t, 0, "Maximum projection distance", 1.2, 0, 100)

gen.add("xy_distance_threshold", double_t, 0, "Horizontal distance threshold", 0.6, 0, 10)
gen.add("z_distance_threshold", double_t, 0, "Vertical distance threshold", 0.6, 0, 10)

gen.add("P", double_t, 0, "Proportional gain for PID controller", 3.0, 0, 100)
gen.add("I", double_t, 0, "Integral gain for PID controller", 0.001, 0, 10)
gen.add("D", double_t, 0, "Derivative gain for PID controller", 65.0, 0, 100)

gen.add("side_offset_mult", double_t, 0, "Side projection multiplier", 0.5, 0, 1.0)

gen.add("rate", int_t, 0, "Update rate", 30, 10, 60)

exit(gen.generate(PACKAGE, "line_planner", "LinePlanner"))